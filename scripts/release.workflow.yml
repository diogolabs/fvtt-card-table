name: Release Foundry VTT Module

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Versão do Release (ex: v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dependencies (@foundryvtt/foundryvtt-cli)
        run: npm install

      - name: Determine Version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_TAG="${{ github.event.inputs.tag }}"
          else
            RAW_TAG="${{ github.ref_name }}"
          fi
          CLEAN_VERSION="${RAW_TAG#v}"
          echo "tag=${RAW_TAG}" >> $GITHUB_OUTPUT
          echo "version=${CLEAN_VERSION}" >> $GITHUB_OUTPUT

      - name: Update module.json Version & Download URL
        run: |
          jq --arg v "${{ steps.version.outputs.version }}" \
             --arg repo "${{ github.repository }}" \
             --arg tag "${{ steps.version.outputs.tag }}" \
             '.version = $v | .url = "https://github.com/\($repo)" | .manifest = "https://github.com/\($repo)/releases/latest/download/module.json" | .download = "https://github.com/\($repo)/releases/download/\($tag)/module.zip"' \
             module.json > module.json.tmp && mv module.json.tmp module.json

      - name: Compile Compendium Packs (JSON -> LevelDB)
        run: npm run pack

      - name: Create module.zip Archive
        run: |
          zip -r module.zip \
            module.json \
            src/ \
            styles/ \
            templates/ \
            lang/ \
            packs/ \
            README.md \
            -x "packs/*/_source/*"

      - name: Upload Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            module.json
            module.zip
